apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: python-web
  template:
    metadata:
      labels:
        app: python-web
    spec:
      containers:
      - name: web-container
        image: web-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels:
    app: python-web
spec:
  type: NodePort
  ports:
    - name: web
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: metrics
      port: 8000
      targetPort: 8000
  selector:
    app: python-web
